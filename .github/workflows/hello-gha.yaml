name: GitHub Actions Demo
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push]
jobs:
  Hello-GitHub-Actions:
    runs-on: ubuntu-latest
    steps:
      - run: echo This is the Ubuntu with version as following
      - run: lsb_release -a
      - run: free -h
      - run: df -h
      - run: ls -l
      - run: docker ps
      - run: java --version
      - run: gradle --version
      - run: mvn --version
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: echo After checking out codes, we will check it ...
      - run: ls -l
      - run: chmod +x ./hello-world/hello-script.sh
      - run: ./hello-world/hello-script.sh
      - run: echo --------------------------------------------------
      - run: echo "Current GitHub workspace = ${{ job.workspace }}."
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - run: echo "Finish the first job :) ... "

  Explore-Some-Features-GHAs:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - run: echo "🍏 This job's status is ${{ job.status }}."

  Test-CustomDNS:
    runs-on: ubuntu-latest

    env:
      CUSTOM_DNS: 192.46.228.6

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure custom DNS for tdc.vv
        shell: bash
        run: |
          set -euo pipefail

          INTERFACE=$(ip route | awk '/default/ {print $5; exit}')

          echo "Default interface: ${INTERFACE}"
          echo "Custom DNS: ${CUSTOM_DNS}"

          sudo resolvectl dns "${INTERFACE}" "${CUSTOM_DNS}"

          # Chỉ domain *.tdc.vv được gửi tới custom DNS
          sudo resolvectl domain "${INTERFACE}" "~tdc.vv"

          resolvectl status "${INTERFACE}"

      - name: Verify DNS resolution
        run: |
          getent hosts test1.tdc.vv
          getent hosts test2.tdc.vv

      - name: Call services using domain
        run: |
          curl --fail --insecure --verbose https://relax.tdc.vv/
          curl --fail --insecure --verbose https://lsa.tdc.vv/